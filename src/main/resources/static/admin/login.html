<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login | VIVIDHATA</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-slate-950 text-white">

<div class="flex min-h-screen items-center justify-center px-6 py-12">

    <div class="w-full max-w-md">

        <!-- Brand -->
        <div class="mb-8 text-center">

            <div
                    class="mx-auto mb-4 flex h-16 w-16 items-center justify-center rounded-2xl bg-indigo-500/10 text-3xl">
                🎯
            </div>

            <h1 class="text-3xl font-bold tracking-tight">
                VIVIDHATA
            </h1>

            <p class="mt-2 text-sm text-slate-400">
                Interview Control Center
            </p>

        </div>


        <!-- Login Card -->
        <div
                class="rounded-3xl border border-slate-800 bg-slate-900/80 p-8 shadow-2xl">

            <div class="mb-8">

                <p
                        class="text-sm font-semibold uppercase tracking-[0.2em] text-indigo-400">
                    Admin Access
                </p>

                <h2 class="mt-3 text-2xl font-bold">
                    Welcome back
                </h2>

                <p class="mt-2 text-sm text-slate-400">
                    Sign in to manage the interview queue.
                </p>

            </div>


            <!-- Error -->
            <div
                    id="loginError"
                    class="mb-6 hidden rounded-xl border border-red-500/20 bg-red-500/10 px-4 py-3 text-sm text-red-400">
                Invalid username or password.
            </div>


            <!-- Login Form -->
            <form
                    action="/login"
                    method="post"
                    class="space-y-6">

                <!-- Username -->
                <div>

                    <label
                            for="username"
                            class="mb-2 block text-sm font-medium text-slate-300">
                        Username
                    </label>

                    <input
                            id="username"
                            name="username"
                            type="text"
                            autocomplete="username"
                            placeholder="Enter admin username"
                            required
                            class="w-full rounded-xl border border-slate-700 bg-slate-950 px-4 py-3 text-white outline-none transition placeholder:text-slate-600 focus:border-indigo-500"
                    >

                </div>


                <!-- Password -->
                <div>

                    <label
                            for="password"
                            class="mb-2 block text-sm font-medium text-slate-300">
                        Password
                    </label>

                    <input
                            id="password"
                            name="password"
                            type="password"
                            autocomplete="current-password"
                            placeholder="Enter admin password"
                            required
                            class="w-full rounded-xl border border-slate-700 bg-slate-950 px-4 py-3 text-white outline-none transition placeholder:text-slate-600 focus:border-indigo-500"
                    >

                </div>


                <!-- Submit -->
                <button
                        type="submit"
                        class="w-full rounded-xl bg-indigo-500 px-5 py-3.5 font-semibold text-white transition hover:bg-indigo-400 active:scale-[0.99]">

                    Sign In

                </button>

            </form>


            <!-- Footer -->
            <div
                    class="mt-8 border-t border-slate-800 pt-6 text-center">

                <a
                        href="/"
                        class="text-sm text-slate-500 transition hover:text-slate-300">

                    ← Back to Student Portal

                </a>

            </div>

        </div>


        <p class="mt-6 text-center text-xs text-slate-600">
            Authorized club administrators only
        </p>

    </div>

</div>


<script>
    const params = new URLSearchParams(window.location.search);

    if (params.get("error") === "true") {
        document.getElementById("loginError")
            .classList.remove("hidden");
    }
</script>

</body>
</html>
:::
